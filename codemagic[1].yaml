workflows:
  unknown-source-signer-ios:
    name: Unknown Source Signer - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "UnknownSourceSigner.xcodeproj"
        XCODE_SCHEME: "UnknownSourceSigner"
      xcode: latest
    scripts:
      - name: Inspect project files
        script: |
          pwd
          ls -la
          test -d "$XCODE_PROJECT"
      - name: Build iOS app without code signing
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.app
